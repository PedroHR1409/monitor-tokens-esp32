; Monitor de Sessões Claude/Codex — ESP32-S3, display IPS 3.5" QSPI (AXS15231B)
; Ver docs/SPEC.md para o racional de cada escolha.

[platformio]
default_envs = esp32-s3-3v5-lcd

[env:esp32-s3-3v5-lcd]
; PlatformIO's official "espressif32" platform still bundles Arduino-ESP32 2.0.17 (IDF 4.4),
; que não tem esp32-hal-periman.h exigido pela GFX Library for Arduino p/ o driver AXS15231B.
; pioarduino empacota o core 3.3.11 (IDF 5.5) — a mesma versão usada no repo de referência.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Memória: 16MB Flash / 8MB PSRAM OPI (obrigatório p/ buffers do LVGL) ---
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    lvgl/lvgl @ ^9.2.2
    moononournation/GFX Library for Arduino @ ^1.6.5
    bblanchon/ArduinoJson @ ^7.2.0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

[env:esp32-s3-3v5-lcd-demo]
extends = env:esp32-s3-3v5-lcd
build_flags =
    ${env:esp32-s3-3v5-lcd.build_flags}
    -DMONITOR_DEMO_DATA=1
